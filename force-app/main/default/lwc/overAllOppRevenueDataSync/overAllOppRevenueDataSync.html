<template>
    <div class="resnitin">

   
    <lightning-card>
        <div class="slds-p-around_medium">
            <!-- ================= Dashboard Header ================= -->

            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-start slds-m-bottom_large">

                <!-- Left Section -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                    
                      <div class="summary-title">
            Revenue View Summary
        </div>

                   <div class="filter-summary">


    <lightning-icon
        icon-name="utility:info_alt"
        size="xx-small"
        class="summary-icon">
    </lightning-icon>

    <span class="summary-text">

        Showing
        <span class="summary-highlight">{kpi.totalOpps}</span>
        Opportunities

        <template if:true={selectedPeriod}>
            <span class="summary-divider">|</span>

            <span class="summary-label">Revenue Period</span>

            <span class="summary-pill">
                {selectedPeriod}
            </span>
        </template>

        <template if:true={fromDate}>

            <span class="summary-divider">|</span>

            <span class="summary-label">Close Date</span>

            <span class="summary-date">

                <lightning-formatted-date-time
                    value={fromDate}
                    day="2-digit"
                    month="short"
                    year="numeric">
                </lightning-formatted-date-time>

                <span class="date-separator">→</span>

                <lightning-formatted-date-time
                    value={toDate}
                    day="2-digit"
                    month="short"
                    year="numeric">
                </lightning-formatted-date-time>

            </span>

        </template>

    </span>

</div>

                    

                    <!-- Revenue Period -->
                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                        <!-- Revenue Period -->
                        <div class={periodClass}>

                            <lightning-combobox label="Revenue Period" value={selectedPeriod} options={periodOptions}
                                onchange={handlePeriodChange}>
                            </lightning-combobox>

                        </div>

                        <!-- From Date -->
                        <template if:true={showCustomDate}>

                            <div class="slds-col slds-size_2-of-12">

                                <lightning-input type="date" label="From Date" value={fromDate} onchange={handleFrom}>
                                </lightning-input>

                            </div>

                            <!-- To Date -->

                            <div class="slds-col slds-size_2-of-12">

                                <lightning-input type="date" label="To Date" value={toDate} onchange={handleTo}>
                                </lightning-input>

                            </div>

                            <div class="slds-col slds-size_1-of-12 slds-align-bottom">

                                <lightning-button variant="brand" label="Apply" onclick={apply}>
                                </lightning-button>

                            </div>

                        </template>

                    </div>

                </div>

                <!-- Right Section -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">

                    <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-wrap">

                        <lightning-button-group>

                            <lightning-button label="All" value="ALL" variant={allVariant}
                                onclick={handleProjectionToggle}>
                            </lightning-button>

                            <lightning-button label="Has Projection" value="HAS" variant={hasVariant}
                                onclick={handleProjectionToggle}>
                            </lightning-button>

                            <lightning-button label="No Projection" value="NO" variant={noVariant}
                                onclick={handleProjectionToggle}>
                            </lightning-button>

                        </lightning-button-group>

                        <div class="slds-m-left_medium">

                            <lightning-button variant="neutral" label="Clear All Filters" icon-name="utility:refresh"
                                onclick={clearFilters}>
                            </lightning-button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ================= Custom Date Panel ================= -->


            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="recordType" label="Engagement Model"
                        options={recordTypeNameOptions} onvaluechange={handleRecordTypeChange}>
                    </c-multi-select-picklist-lwc>
                </div>

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="stage" label="Stage" options={stageOptions}
                        onvaluechange={handleStageChange}>
                    </c-multi-select-picklist-lwc>
                </div>

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="businessUnit" label="Business Unit"
                        options={businessUnitOptions} onvaluechange={handleBusinessUnitChange}>
                    </c-multi-select-picklist-lwc>
                </div>

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="geo" label="Geo Wise" options={geoOptions}
                        onvaluechange={handleGeoChange}>
                    </c-multi-select-picklist-lwc>
                </div>

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="owner" label="Opportunity Owner" options={ownerOptions}
                        onvaluechange={handleOwnerChange}>
                    </c-multi-select-picklist-lwc>
                </div>

                <div class="slds-col slds-size_2-of-12">
                    <c-multi-select-picklist-lwc data-id="bussinessType" label="Business Type"
                        options={bussinessTypeOptions} onvaluechange={handleBussinessTypeChange}>
                    </c-multi-select-picklist-lwc>
                </div>

            </div>


            <!-- Active Filters -->
            <template if:true={hasActiveFilters}>
                <div class="active-filters">

                    <span class="filter-title">Active Filters :</span>

                    <!-- Engagement Model -->
                    <template for:each={selectedrecordType} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="recordType"
                            onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <!-- Stage -->
                    <template for:each={selectedStage} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="stage" onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <!-- Business Unit -->
                    <template for:each={selectedBusinessUnit} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="businessUnit"
                            onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <!-- Opportunity Owner -->
                    <template for:each={selectedOwner} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="owner" onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <!-- Geo -->
                    <template for:each={selectedGeo} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="geo" onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <template for:each={selectedbussinessType} for:item="item">
                        <lightning-pill key={item} label={item} name={item} data-filter="bussinesstype"
                            onremove={removeFilter}>
                        </lightning-pill>
                    </template>

                    <lightning-button variant="base" label="Clear All" icon-name="utility:close" onclick={clearFilters}>
                    </lightning-button>

                </div>
            </template>

            <!-- <div class="action-center slds-m-top_large"> -->

                    <div class="slds-col slds-size_1-of-4">

                            <div>{kpi.noRP}</div>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-4">

                </div> -->

            <div class="dashboard">




                <div class="kpi-card blue">
                    <lightning-icon icon-name="standard:opportunity" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Total Opportunities</div>
                        <div class="kpi-value">{kpi.totalOpps}</div>
                    </div>
                </div>


                <div class="kpi-card purple">
                    <lightning-icon icon-name="utility:money" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Total TCV (USD)</div>
                        <div class="kpi-value">{totalTCVFormatted}</div>
                    </div>
                </div>

                <div class="kpi-card orange">
                    <lightning-icon icon-name="utility:currency" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Total ACV (USD)</div>
                        <div class="kpi-value">{totalACVFormatted}</div>
                    </div>
                </div>

                <div class="kpi-card teal">
                    <lightning-icon icon-name="utility:chart" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Current FY Revenue</div>

                        <div class="kpi-value">{cqRevenueFormatted}</div>
                    </div>
                </div>

                <div class="kpi-card navy">
                    <lightning-icon icon-name="utility:chart" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Next FY Revenue</div>

                        <div class="kpi-value">{nqRevenueFormatted}</div>
                    </div>
                </div>

                <div class="kpi-card gold">
                    <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Extended Revenue</div>
                        <div class="kpi-value">{extendedRevenueFormatted}</div>
                    </div>
                </div>
                <div class="kpi-card green">
                    <lightning-icon icon-name="utility:success" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">Has Revenue Projection</div>
                        <div class="kpi-value">{kpi.hasRP}</div>
                    </div>
                </div>

                <div class="kpi-card red">
                    <lightning-icon icon-name="utility:error" size="small"></lightning-icon>

                    <div class="kpi-content">
                        <div class="kpi-title">No Revenue Projection</div>
                        <div class="kpi-value">{kpi.noRP}</div>
                    </div>
                </div>

            </div>
        </div>

        <template lwc:if={showColumnModal}>

            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">



                <div class="slds-modal__container">


                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_medium">
                            Select Display Columns
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <c-column-manager title="Display Columns" columns={columnOptions}
                            selected-values={selectedFields} locked-values={lockedFields}
                            onvaluechange={handleColumnChange} onsave={handleSaveColumns}>
                        </c-column-manager>

                        <!-- <c-dual-listbox-lwc label="Columns" options={columnOptions} value={selectedFields}

                        </c-dual-listbox-lwc> -->

                    </div>

                    <footer class="slds-modal__footer">
                        <div class="backButton" onclick={closeColumnModal}>
                            <lightning-button-icon icon-name="utility:back" variant="bare" alternative-text="Back"
                                size="small">
                            </lightning-button-icon>

                            <span>Back to Dashboard</span>
                        </div>

                        <!-- <lightning-button label="Reset" onclick={handleResetColumns}>

                        <lightning-button label="Cancel" onclick={closeColumnManager}>
                        </lightning-button>

                        <lightning-button variant="brand" label="Apply" onclick={handleSaveColumns}>
                        </lightning-button> -->

                    </footer>

                    <!-- <footer class="slds-modal__footer">

                        </lightning-button>

                    </footer> -->

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>

        <div class="slds-p-around_medium">


            <!-- <c-dual-listbox-lwc label="Select Columns" options={columnOptions} value={selectedFields}
                onvaluechange={handleFieldSelection}>
            </c-dual-listbox-lwc> -->

            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium">
                </lightning-spinner>
            </template>

            <!-- Datatable -->
            <template if:true={hasData}>
                <lightning-button label="Columns" icon-name="utility:table" variant="neutral" onclick={openColumnModal}>
                </lightning-button>


                <lightning-input type="search" label="Search" placeholder="Search Opportunity..." value={searchKey}
                    onchange={handleSearch} class="slds-m-bottom_medium">
                </lightning-input>

                <div class="slds-grid slds-wrap slds-m-bottom_small">

                    <div class="slds-col slds-size_1-of-2">
                        <strong>Total Records:</strong> {totalRecordCount}
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                        <strong>Showing: </strong>&nbsp;
                        {showingFrom} - {showingTo}
                        of {filteredRecordCount}
                    </div>

                </div>

                <div class="table-container">

                    <lightning-datatable key-field="opportunitySFId" data={paginatedData} columns={columns}
                        hide-checkbox-column show-row-number-column column-widths-mode="auto"
                        default-sort-direction={defaultSortDirection} sorted-direction={sortDirection}
                        sorted-by={sortedBy} onsort={onHandleSort}>
                    </lightning-datatable>

                </div>

                <!-- Pagination -->
                <div class="slds-grid slds-grid_align-center slds-m-top_medium">

                    <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrevious}
                        disabled={disablePrevious}>
                    </lightning-button>

                    <div class="slds-p-horizontal_large">
                        <strong>Page {page} of {totalPages}</strong>
                    </div>

                    <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                        onclick={handleNext} disabled={disableNext}>
                    </lightning-button>

                </div>

            </template>

            <!-- No Records -->
            <template if:false={hasData}>

                <div class="slds-text-align_center slds-p-around_large">

                    <lightning-formatted-text value="No Revenue Projection records found.">
                    </lightning-formatted-text>

                </div>

            </template>

            <!-- Export Button -->
            <div class="slds-m-top_large slds-text-align_center">

                <lightning-button label="Export CSV" variant="brand" icon-name="utility:download" onclick={handleExport}
                    disabled={isLoading}>
                </lightning-button>

            </div>

    </lightning-card>
