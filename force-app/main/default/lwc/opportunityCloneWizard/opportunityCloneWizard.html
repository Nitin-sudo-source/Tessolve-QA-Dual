<template>

    <!-- ============================================================
        Loader
    ============================================================= -->

    <template if:true={isLoading}>

        <div class="loader-container">

            <lightning-spinner alternative-text="Loading" size="large">
            </lightning-spinner>

        </div>

    </template>

    <!-- ============================================================
        Clone Wizard
    ============================================================= -->

    <template if:false={isLoading}>

        <section class="clone-container">

            <!-- ===========================================
                Header
            ============================================ -->

            <div class="clone-header">

                <div>

                    <h1 class="title">
                        Clone Opportunity
                    </h1>

                    <p class="subtitle">
                        Create a new Opportunity by cloning an existing Opportunity.
                    </p>

                </div>

                <div>

                    <lightning-button label="Cancel" onclick={handleCancel}>
                    </lightning-button>

                </div>

            </div>

            <!-- ===========================================
                Progress
            ============================================ -->

            <div class="progress-wrapper">

                <lightning-progress-indicator current-step={currentStep} type="path">

                    <lightning-progress-step value="1" label="Opportunity">
                    </lightning-progress-step>

                    <lightning-progress-step value="2" label="Configuration">
                    </lightning-progress-step>

                    <lightning-progress-step value="3" label="Complete">
                    </lightning-progress-step>

                </lightning-progress-indicator>

            </div>

            <!-- ===========================================
                Body
            ============================================ -->

            <div class="body-wrapper">

                <!-- =======================================
                    LEFT
                ======================================== -->

                <div class="left-panel">

                    <template if:true={isStepOne}>

                        <lightning-card title="Clone Opportunity">

                            <div class="card-body">

                                <div class="slds-grid slds-wrap">

                                    <!-- Opportunity Name -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input label="Opportunity Name" data-field="Name" required
                                            value={wrapper.cloneOpportunity.Name} onchange={handleFieldChange}>

                                        </lightning-input>

                                    </div>

                                    <!-- Record Type -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-combobox label="Record Type" data-field="RecordTypeId"
                                            value={wrapper.cloneOpportunity.RecordTypeId} options={wrapper.recordTypes}
                                            onchange={handleFieldChange}>

                                        </lightning-combobox>

                                    </div>

                                    <!-- Stage -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-combobox label="Stage" data-field="StageName"
                                            value={wrapper.cloneOpportunity.StageName} options={wrapper.stageOptions}
                                            onchange={handleFieldChange}>

                                        </lightning-combobox>

                                    </div>

                                    <!-- Close Date -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input type="date" label="Close Date" data-field="CloseDate"
                                            value={wrapper.cloneOpportunity.CloseDate} onchange={handleFieldChange}>

                                        </lightning-input>

                                    </div>

                                    <!-- Account -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input label="Account" disabled
                                            value={wrapper.cloneOpportunity.Account.Name}>

                                        </lightning-input>

                                    </div>

                                    <!-- Currency -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input label="Currency" disabled
                                            value={wrapper.cloneOpportunity.CurrencyIsoCode}>

                                        </lightning-input>

                                    </div>

                                    <!-- Owner -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-record-picker label="Opportunity Owner" object-api-name="User"
                                            value={wrapper.cloneOpportunity.OwnerId} data-field="OwnerId"
                                            onchange={handleFieldChange}>

                                        </lightning-record-picker>

                                    </div>

                                    <!-- Technical Owner -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-record-picker label="Technical Owner" object-api-name="User"
                                            value={wrapper.cloneOpportunity.Technical_Owner__c}
                                            data-field="Technical_Owner__c" onchange={handleFieldChange}>

                                        </lightning-record-picker>

                                    </div>

                                    <!-- Lead Source -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input label="Lead Source" data-field="LeadSource"
                                            value={wrapper.cloneOpportunity.LeadSource} onchange={handleFieldChange}>

                                        </lightning-input>

                                    </div>

                                    <!-- Type -->

                                    <div class="slds-col slds-size_1-of-2">

                                        <lightning-input label="Opportunity Type" data-field="Type"
                                            value={wrapper.cloneOpportunity.Type} onchange={handleFieldChange}>

                                        </lightning-input>

                                    </div>

                                    <!-- Description -->

                                    <div class="slds-col slds-size_1-of-1">

                                        <lightning-textarea label="Description" data-field="Description"
                                            value={wrapper.cloneOpportunity.Description} onchange={handleFieldChange}>

                                        </lightning-textarea>

                                    </div>

                                </div>

                            </div>

                        </lightning-card>

                    </template>

                </div>

                <!-- =======================================
                    RIGHT PANEL
                ======================================== -->

                <div class="right-panel">

                    <lightning-card title="Source Opportunity">

                        <div class="summary">

                            <div class="summary-item">

                                <span>Name</span>

                                <strong>

                                    {wrapper.sourceOpportunity.Name}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Account</span>

                                <strong>

                                    {wrapper.sourceOpportunity.Account.Name}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Record Type</span>

                                <strong>

                                    {wrapper.sourceOpportunity.RecordType.Name}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Stage</span>

                                <strong>

                                    {wrapper.sourceOpportunity.StageName}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Close Date</span>

                                <strong>

                                    {wrapper.sourceOpportunity.CloseDate}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Engagement Model</span>

                                <strong>

                                    {wrapper.engagementModel}

                                </strong>

                            </div>

                        </div>

                    </lightning-card>

                    <br />

                    <lightning-card title="Related Records">

                        <div class="summary">

                            <div class="summary-item">

                                <span>Revenue Line Items</span>

                                <strong>

                                    {wrapper.relatedCounts.revenueLineItems}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Revenue Projections</span>

                                <strong>

                                    {wrapper.relatedCounts.revenueProjections}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Files</span>

                                <strong>

                                    {wrapper.relatedCounts.files}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Opportunity Team</span>

                                <strong>

                                    {wrapper.relatedCounts.opportunityTeam}

                                </strong>

                            </div>

                            <div class="summary-item">

                                <span>Contact Roles</span>

                                <strong>

                                    {wrapper.relatedCounts.contactRoles}

                                </strong>

                            </div>

                        </div>

                    </lightning-card>

                </div>

            </div>

        </section>

    </template>


    <!-- =====================================================
                        STEP 2
                    ====================================================== -->

    <template if:true={isStepTwo}>

        <lightning-card title="Clone Configuration">

            <div class="card-body">

                <!-- ===============================
                                    T&M Configuration
                                ================================ -->

                <template if:true={wrapper.showRevenueLineItems}>

                    <div class="section-header">

                        Revenue Line Items

                    </div>

                    <div class="section-description">

                        Revenue Line Items from the source
                        Opportunity will be cloned into the
                        newly created Opportunity.

                    </div>

                    <div class="toggle-row">

                        <lightning-input type="toggle" label="Clone Revenue Line Items"
                            checked={wrapper.cloneConfiguration.cloneRevenueLineItems}
                            data-field="cloneRevenueLineItems" onchange={handleToggle}>

                        </lightning-input>

                    </div>

                </template>

                <!-- ===============================
                                    Revenue Projection
                                ================================ -->

                <template if:true={wrapper.showRevenueProjectionPopup}>

                    <div class="section-header">

                        Revenue Projection

                    </div>

                    <div class="info-box">

                        <lightning-icon icon-name="utility:info" size="small">

                        </lightning-icon>

                        <div>

                            A fresh Revenue Projection will be
                            created after the Opportunity is
                            cloned.

                            <br /><br />

                            The following Revenue Projection
                            periods will be created.

                        </div>

                    </div>

                    <div class="projection-grid">

                        <span>CQ1</span>

                        <span>CQ2</span>

                        <span>CQ3</span>

                        <span>CQ4</span>

                        <span>NQ1</span>

                        <span>NQ2</span>

                        <span>NQ3</span>

                        <span>NQ4</span>

                        <span>Extended Year</span>

                    </div>

                </template>

                <!-- ===============================
                                    Common Options
                                ================================ -->

                <div class="section-header">

                    Additional Clone Options

                </div>

                <div class="option-grid">

                    <lightning-input type="toggle" label="Clone Files" checked={wrapper.cloneConfiguration.cloneFiles}
                        data-field="cloneFiles" onchange={handleToggle}>

                    </lightning-input>

                    <lightning-input type="toggle" label="Clone Opportunity Team"
                        checked={wrapper.cloneConfiguration.cloneOpportunityTeam} data-field="cloneOpportunityTeam"
                        onchange={handleToggle}>

                    </lightning-input>

                    <lightning-input type="toggle" label="Clone Contact Roles"
                        checked={wrapper.cloneConfiguration.cloneContactRoles} data-field="cloneContactRoles"
                        onchange={handleToggle}>

                    </lightning-input>

                </div>

            </div>

        </lightning-card>

    </template>


    <!-- =====================================================
                    RIGHT PANEL
                ====================================================== -->

    <div class="right-panel">

        <lightning-card title="Clone Summary">

            <div class="summary">

                <div class="summary-item">

                    <span>Opportunity</span>

                    <strong>

                        {wrapper.cloneOpportunity.Name}

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Record Type</span>

                    <strong>

                        {wrapper.cloneOpportunity.RecordTypeId}

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Stage</span>

                    <strong>

                        {wrapper.cloneOpportunity.StageName}

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Close Date</span>

                    <strong>

                        {wrapper.cloneOpportunity.CloseDate}

                    </strong>

                </div>

                <div class="summary-divider"></div>

                <div class="summary-item">

                    <span>Revenue Line Items</span>

                    <strong>

                        <template if:true={wrapper.cloneConfiguration.cloneRevenueLineItems}>

                            Yes

                        </template>

                        <template if:false={wrapper.cloneConfiguration.cloneRevenueLineItems}>

                            No

                        </template>

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Files</span>

                    <strong>

                        <template if:true={wrapper.cloneConfiguration.cloneFiles}>

                            Yes

                        </template>

                        <template if:false={wrapper.cloneConfiguration.cloneFiles}>

                            No

                        </template>

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Opportunity Team</span>

                    <strong>

                        <template if:true={wrapper.cloneConfiguration.cloneOpportunityTeam}>

                            Yes

                        </template>

                        <template if:false={wrapper.cloneConfiguration.cloneOpportunityTeam}>

                            No

                        </template>

                    </strong>

                </div>

                <div class="summary-item">

                    <span>Contact Roles</span>

                    <strong>

                        <template if:true={wrapper.cloneConfiguration.cloneContactRoles}>

                            Yes

                        </template>

                        <template if:false={wrapper.cloneConfiguration.cloneContactRoles}>

                            No

                        </template>

                    </strong>

                </div>

            </div>

        </lightning-card>

    </div>


    <!-- =====================================================
                FOOTER
            ====================================================== -->

    <footer class="wizard-footer">

        <div>

            <lightning-button label="Previous" onclick={handlePrevious} disabled={disablePrevious}>

            </lightning-button>

        </div>

        <div class="footer-actions">

            <lightning-button label="Cancel" onclick={handleCancel}>

            </lightning-button>

            <lightning-button variant="brand" label={buttonLabel} onclick={handleNext} disabled={isSaving}>

            </lightning-button>

        </div>

    </footer>


    <!-- ============================================================
    REVENUE PROJECTION MODAL
============================================================= -->

    <template if:true={showRevenueProjection}>

        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container modal-xl">

                <!-- Header -->

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">

                        Revenue Projection Overview

                    </h2>

                </header>

                <!-- Body -->

                <div class="slds-modal__content slds-p-around_none">

                    <c-revenue-projection-popup record-id={wrapper.clonedOpportunityId}
                        onsave={handleRevenueProjectionSaved} oncancel={handleRevenueProjectionCancel}>

                    </c-revenue-projection-popup>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>


    <!-- ============================================================
    SAVING OVERLAY
============================================================= -->

    <template if:true={isSaving}>

        <section class="saving-overlay">

            <div class="saving-card">

                <lightning-spinner size="large" alternative-text="Saving">

                </lightning-spinner>

                <h2>

                    Creating Opportunity...

                </h2>

                <p>

                    Please wait while we clone the Opportunity and
                    prepare related records.

                </p>

            </div>

        </section>

    </template>


    <!-- ============================================================
    SUCCESS SCREEN
============================================================= -->

    <template if:true={isStepThree}>

        <section class="success-wrapper">

            <div class="success-card">

                <div class="success-icon">

                    <lightning-icon icon-name="utility:success" variant="success" size="large">

                    </lightning-icon>

                </div>

                <h1>

                    Opportunity Cloned Successfully

                </h1>

                <p>

                    Your new Opportunity has been created successfully.

                </p>

                <div class="success-summary">

                    <div class="summary-row">

                        <span>

                            Opportunity Name

                        </span>

                        <strong>

                            {wrapper.cloneOpportunity.Name}

                        </strong>

                    </div>

                    <div class="summary-row">

                        <span>

                            Record Type

                        </span>

                        <strong>

                            {wrapper.cloneOpportunity.RecordTypeId}

                        </strong>

                    </div>

                    <div class="summary-row">

                        <span>

                            Stage

                        </span>

                        <strong>

                            {wrapper.cloneOpportunity.StageName}

                        </strong>

                    </div>

                    <div class="summary-row">

                        <span>

                            Engagement Model

                        </span>

                        <strong>

                            {wrapper.engagementModel}

                        </strong>

                    </div>

                </div>

                <div class="success-actions">

                    <lightning-button label="Clone Another" onclick={handleCloneAnother}>

                    </lightning-button>

                    <lightning-button variant="brand" label="Open Opportunity" onclick={handleOpenOpportunity}>

                    </lightning-button>

                </div>

            </div>

        </section>

    </template>


    <!-- ============================================================
    EMPTY STATE
============================================================= -->

    <template if:false={wrapper.success}>

        <section class="empty-state">

            <lightning-icon icon-name="utility:error" variant="error" size="large">

            </lightning-icon>

            <h2>

                Unable to Load Clone Wizard

            </h2>

            <p>

                {wrapper.message}

            </p>

            <lightning-button label="Back" onclick={handleCancel}>

            </lightning-button>

        </section>

    </template>

</template>
